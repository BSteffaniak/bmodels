[package]
name = "bmodels_sources"
description = "Model registry source adapters for bmodels"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
async-trait = { workspace = true }
bmodels_model = { workspace = true }
chrono = { workspace = true, features = ["std"] }
globset = { workspace = true }
roxmltree = { workspace = true }
serde_json = { workspace = true }
switchy_http = { workspace = true, features = ["gzip", "reqwest"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "time"] }

[features]
default = []
fail-on-warnings = [
    "bmodels_model/fail-on-warnings",
    "switchy_http/fail-on-warnings",
]
