# How listings from different sources map onto one canonical model (`vendor/family`).

[canonical]
collapse_snapshots = true
# Routing, alias, and weight-format suffixes that do not make a different model.
strip_suffixes = [
    "-awq",
    "-bf16",
    "-fp16",
    "-fp8",
    "-gguf",
    "-gptq",
    "-int4",
    "-int8",
    "-mlx",
    "-mxfp4",
    "-nvfp4",
    ":beta",
    ":exacto",
    ":extended",
    ":floor",
    ":free",
    ":nitro",
    ":online",
    ":thinking",
    "-latest",
]

[canonical.vendor_aliases]
alibaba = "qwen"
"deepseek-ai" = "deepseek"
gemini = "google"
"meta-llama" = "meta"
mistralai = "mistral"
moonshotai = "moonshot"
"vertex_ai" = "google"
"x-ai" = "xai"
"z-ai" = "zhipu"
zai = "zhipu"
"zai-org" = "zhipu"
zhipuai = "zhipu"

# Model-id prefix → vendor, for hosts whose ids carry no vendor (`llama-3.3-70b-versatile`).
[canonical.family_vendors]
aya = "cohere"
bge = "baai"
